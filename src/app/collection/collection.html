<div class="min-h-screen bg-[#141414] text-white animate-page-in">

  @if (loading()) {
    <div class="flex items-center justify-center min-h-[60vh]">
      <svg class="animate-spin w-12 h-12 text-[#e50914]" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
      </svg>
    </div>
  }

  @if (error()) {
    <div class="text-center py-24">
      <p class="text-gray-400 text-xl">{{ error() }}</p>
    </div>
  }

  @if (collection(); as col) {
    @if (backdropUrl()) {
      <div class="relative h-56 sm:h-72 overflow-hidden">
        <img [src]="backdropUrl()" [alt]="col.name" class="w-full h-full object-cover"/>
        <div class="absolute inset-0 bg-linear-to-t from-[#141414] via-[#141414]/60 to-transparent"></div>
      </div>
    }

    <div class="max-w-screen-2xl mx-auto px-6 py-8">
      <h1 class="text-3xl font-black mb-2">{{ col.name }}</h1>
      @if (col.overview) {
        <p class="text-gray-400 text-sm leading-relaxed mb-8 max-w-3xl">{{ col.overview }}</p>
      }
      <p class="text-gray-500 text-sm mb-6">{{ col.parts.length }} film{{ col.parts.length !== 1 ? 's' : '' }}</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        @for (part of col.parts; track part.id) {
          <app-media-card [media]="part" />
        }
      </div>
    </div>
  }
</div>
