<div class="mb-10 group/shelf">
  <div class="flex items-center justify-between mb-3 px-0">
    <h2 class="text-lg font-bold text-white">{{ title() }}</h2>
    <div class="flex items-center gap-3">
      @if (viewAllLink()) {
        <a [routerLink]="viewAllLink()" class="text-gray-400 hover:text-white text-xs transition-colors">View all</a>
      }
      <div class="flex gap-1 opacity-0 group-hover/shelf:opacity-100 transition-opacity">
        <button
          class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"
          (click)="scroll('left')"
          aria-label="Scroll left"
        >
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button
          class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"
          (click)="scroll('right')"
          aria-label="Scroll right"
        >
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div
    #scrollRef
    class="flex gap-3 overflow-x-auto pb-2"
    style="scrollbar-width:none; -webkit-overflow-scrolling:touch;"
  >
    @for (item of visibleItems(); track item.id; let i = $index) {
      <div class="shrink-0 w-36 sm:w-44" [class.pt-6]="ranked()">
        @if (ranked()) {
          <span
            class="block text-5xl sm:text-6xl font-black leading-none select-none mb-1 -mt-6"
            style="color:transparent; -webkit-text-stroke:2px #4a4a4a;"
          >{{ i + 1 }}</span>
        }
        <app-media-card [media]="item" [dismissible]="dismissible()" />
      </div>
    }
  </div>
</div>
