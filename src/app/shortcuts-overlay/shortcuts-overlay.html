@if (open()) {
  <div
    class="fixed inset-0 z-200 bg-black/70 flex items-center justify-center p-4 animate-fade-in"
    (click)="open.set(false)"
  >
    <div
      class="bg-[#1f1f1f] border border-gray-800 rounded-xl p-8 w-full max-w-md shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-white">Keyboard Shortcuts</h2>
        <button class="text-gray-500 hover:text-white transition-colors" (click)="open.set(false)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="space-y-3 text-sm">
        @for (group of shortcuts; track group.label) {
          <div class="text-[#e50914] uppercase tracking-widest text-xs font-bold mb-2 mt-4 first:mt-0">{{ group.label }}</div>
          @for (s of group.items; track s.key) {
            <div class="flex items-center justify-between py-1.5 border-b border-gray-800">
              <span class="text-gray-300">{{ s.description }}</span>
              <kbd class="bg-[#2a2a2a] border border-gray-700 text-gray-200 text-xs px-2 py-1 rounded font-mono">{{ s.key }}</kbd>
            </div>
          }
        }
      </div>

      <p class="text-gray-600 text-xs mt-6 text-center">Press <kbd class="bg-[#2a2a2a] border border-gray-700 px-1.5 py-0.5 rounded font-mono text-gray-400">?</kbd> or <kbd class="bg-[#2a2a2a] border border-gray-700 px-1.5 py-0.5 rounded font-mono text-gray-400">Esc</kbd> to close</p>
    </div>
  </div>
}

@if (!open()) {
  <div class="fixed bottom-20 right-6 z-40">
    <button
      class="bg-[#1f1f1f] border border-gray-700 text-gray-500 hover:text-white hover:border-gray-500 transition-colors text-xs px-2.5 py-1.5 rounded-md font-mono"
      (click)="open.set(true)"
      title="Show keyboard shortcuts"
    >?</button>
  </div>
}
